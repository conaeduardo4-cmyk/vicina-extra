<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090B">
<title>Vicina Extra</title>
</head>
<body>
<div id="app">
  <section class="screen tab" id="s-home"></section>
  <section class="screen tab" id="s-luoghi">
    <div class="map-wrap"><div id="map"></div><div class="map-msg" id="map-msg" hidden></div></div>
    <div class="m-head">
      <label class="m-search"><svg class="i"><use href="#i-search"/></svg><input id="m-q" type="search" placeholder="Cerca un servizio o un luogo" autocomplete="off" enterkeyhint="search" aria-label="Cerca un servizio o un luogo"></label>
      <div class="chips" id="m-filters"></div>
    </div>
    <div class="m-sheet" id="m-sheet"><div class="grab"></div><div class="chips" id="m-cats"></div><div id="m-list"></div></div>
  </section>
  <section class="screen" id="s-luogo"></section>
  <section class="screen tab" id="s-aiuti"></section>
  <section class="screen" id="s-aiuto"></section>
  <section class="screen" id="s-quiz"></section>
  <section class="screen tab" id="s-tutele"></section>
  <section class="screen" id="s-tutela"></section>
  <section class="screen" id="s-insieme"></section>
  <section class="screen tab" id="s-tu"></section>
  <section class="screen" id="s-saved"></section>
  <section class="screen" id="s-auth"></section>
  <section class="screen" id="s-setup"></section>
  <section class="screen" id="s-edit"></section>
  <section class="screen" id="s-vicina"></section>
  <section class="screen" id="s-letters"></section>
  <section class="screen" id="s-letter"></section>
  <section class="screen" id="s-dead"></section>
  <section class="screen" id="s-crea"></section>
  <section class="screen" id="s-doc"></section>
  <section class="screen" id="s-agg"></section>
  <section class="screen" id="s-invite"></section>
  <section class="screen" id="s-ai">
    <div class="ai-top"><button class="pillbtn" data-a="ai-list"><svg class="i"><use href="#i-menu"/></svg>Le tue chat</button>
      <div class="ai-ttl" id="ai-ttl"></div>
      <button class="roundbtn" data-a="ai-new" aria-label="Nuova chat"><svg class="i"><use href="#i-edit"/></svg></button></div>
    <div id="ai-msgs"></div>
    <div class="ai-foot">
      <div class="ai-in"><input id="ai-txt" type="text" placeholder="Scrivi la tua domanda…" maxlength="1500" enterkeyhint="send" aria-label="Scrivi la tua domanda">
        <button class="ai-send" data-a="ai-send" aria-label="Invia"><svg class="i"><use href="#i-send"/></svg></button></div>
      <p class="ai-note">Le risposte possono sbagliare: per decisioni importanti chiedi a un patronato o ai servizi sociali.</p>
    </div>
  </section>
  <section class="screen" id="s-ailist"></section>

  <nav id="nav">
    <button data-tab="home"><svg class="i"><use href="#i-home"/></svg><span>Home</span></button>
    <button data-tab="luoghi"><svg class="i"><use href="#i-pin"/></svg><span>Luoghi</span></button>
    <button data-tab="aiuti"><svg class="i"><use href="#i-doc"/></svg><span>Aiuti</span></button>
    <button data-tab="tutele"><svg class="i"><use href="#i-shield"/></svg><span>Tutele</span></button>
    <button data-tab="tu"><svg class="i"><use href="#i-user"/></svg><span>Tu</span></button>
  </nav>
  <div class="sheet" id="sheet" hidden><div class="sheet-card" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheet-body"></div></div></div>
  <div class="qexit" id="cover" hidden aria-label="Meteo"><div class="cv-top"><b>Meteo</b><span>Oggi</span></div><div class="cv-main"><svg viewBox="0 0 64 64" width="96" height="96" aria-hidden="true"><circle cx="26" cy="26" r="12" fill="#FFC94D"/><path d="M20 46h26a9 9 0 000-18 13 13 0 00-24 4 7 7 0 00-2 14z" fill="#E6EAF0"/></svg><b>18°</b><span>Poco nuvoloso</span></div><div class="cv-days"><span>Mer<b>19°</b></span><span>Gio<b>17°</b></span><span>Ven<b>20°</b></span><span>Sab<b>21°</b></span></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" id="icons"></svg>
<script type="module" src="/src/main.js"></script>
</body>
</html>
