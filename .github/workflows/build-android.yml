# Compila Vicina Extra per Android e pubblica l'APK nelle Releases.
# Avvio: Actions → "Compila Android" → Run workflow (oppure un tag v*).
# Firma: se ci sono i secrets ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD (facoltativo ANDROID_KEY_ALIAS)
# l'APK è firmato sempre con la stessa chiave e gli aggiornamenti si installano sopra; senza, si pubblica l'APK di debug.
name: Compila Android

on:
  workflow_dispatch:
    inputs:
      versione:
        description: 'Numero di versione (es. 1.0.0). Vuoto = 1.0.<numero compilazione>'
        type: string
        required: false
        default: ''
      novita:
        description: 'Novità di questa versione (facoltativo)'
        type: string
        required: false
        default: ''
  push:
    tags: ['v*']

env:
  APP_VERSION: ${{ inputs.versione != '' && inputs.versione || format('1.0.{0}', github.run_number) }}

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Dipendenze
        run: npm install --no-audit --no-fund --prefer-offline @maplibre/maplibre-gl-style-spec --no-save && node scripts/check-map-style.mjs
      - name: Interfaccia
        run: VITE_APP_VERSION="$APP_VERSION" npm run build
      - name: Progetto Android
        run: |
          run() { echo "▶ $*"; c=0; "$@" > "$RUNNER_TEMP/step.log" 2>&1 || c=$?; cat "$RUNNER_TEMP/step.log"; if [ $c -ne 0 ]; then echo "::error title=$1 $2 fallito::$(tail -c 1500 "$RUNNER_TEMP/step.log" | tr '\n' ' ')"; exit $c; fi; }
          run npx cap add android
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"; echo "sdk.dir=$SDK" > android/local.properties
          (yes 2>/dev/null | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1) || true
          run npm run native
          npx capacitor-assets generate --android --iconBackgroundColor '#5B43F0' --iconBackgroundColorDark '#5B43F0' --splashBackgroundColor '#09090B' --splashBackgroundColorDark '#09090B' || echo "::warning::Icone non generate"
          run npx cap sync android
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]+\"/versionName \"$APP_VERSION\"/" android/app/build.gradle
      # cache di Gradle tra una compilazione e l'altra: la seconda volta è molto più veloce
      - uses: gradle/actions/setup-gradle@v4
        with: { cache-read-only: false }
      - name: Compila
        working-directory: android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          chmod +x gradlew
          # solo quello che serve: con la chiave di firma la versione release, senza l'APK di debug
          T=assembleDebug; [ -n "$KS" ] && T="assembleDebug assembleRelease"
          ./gradlew $T --parallel --build-cache -Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx2g > "$RUNNER_TEMP/g.log" 2>&1 || { cat "$RUNNER_TEMP/g.log"; echo "::error title=Gradle::$(grep -E 'error:|FAILURE|What went wrong' -A3 "$RUNNER_TEMP/g.log" | head -20 | tr '\n' ' ' | cut -c1-1500)"; exit 1; }
          tail -5 "$RUNNER_TEMP/g.log"
      - name: Firma
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/VicinaExtra-$APP_VERSION-debug.apk"
          if [ -n "$KS" ] && [ -n "$KS_PASS" ]; then
            printf '%s' "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/k.jks"
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/a.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/k.jks" --ks-pass env:KS_PASS --ks-key-alias "${KEY_ALIAS:-vicinaextra}" --key-pass env:KS_PASS --out out/VicinaExtra.apk "$RUNNER_TEMP/a.apk"
            rm -f "$RUNNER_TEMP/k.jks"; echo "APK firmato" >> $GITHUB_STEP_SUMMARY
          else
            cp "out/VicinaExtra-$APP_VERSION-debug.apk" out/VicinaExtra.apk
            echo "::warning::Nessuna chiave di firma nei secrets: pubblico l'APK di debug (per installarlo sopra una versione precedente può servire disinstallarla)."
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: VicinaExtra-android, path: out/* }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Vicina Extra ${{ env.APP_VERSION }}
          body: ${{ inputs.novita }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          files: out/*
